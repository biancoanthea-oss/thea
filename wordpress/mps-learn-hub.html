<!--
  ┌───────────────────────────────────────────────────────────────────────┐
  │  MPS LEARN HUB — WordPress Custom HTML block                            │
  │                                                                         │
  │  HOW TO USE                                                             │
  │  1. In WordPress, edit the page → add a "Custom HTML" block             │
  │     (Gutenberg) OR an "HTML" widget (Elementor / Divi).                 │
  │  2. Copy EVERYTHING in this file (from the <style> tag below to the     │
  │     end) and paste it in. Update the page.                              │
  │                                                                         │
  │  TO ADD YOUR OWN VIDEOS                                                 │
  │  In each <button class="mps-card__play" ...> set:                       │
  │     data-embed="https://www.youtube.com/embed/XXXXXXXXXXX"              │
  │  (YouTube: click Share → Embed and copy the src URL. Vimeo works too:   │
  │   https://player.vimeo.com/video/XXXXXXXXX )                            │
  │                                                                         │
  │  TO CHANGE A THUMBNAIL                                                   │
  │  On each <figure ... style="--thumb:url('...')">, put your image URL    │
  │  from the WordPress Media Library between the quotes.                   │
  │                                                                         │
  │  Colours follow the Stacked brand sheet:                                │
  │     orange #EE7623 · dark grey #25282A · light grey #E4E5E3            │
  └───────────────────────────────────────────────────────────────────────┘
-->

<style>
  /* ── FONT: Gotham Round ────────────────────────────────────────────────
     Gotham Rounded is a licensed Hoefler&Co font, so it must be served from
     YOUR site. Two ways — you only need one:

     A) Your site already loads Gotham Rounded (Cloud.typography / self-host).
        Nothing to do — the local() lookups below pick it up automatically.

     B) Self-host your licensed files: upload the .woff2 files to
        /wp-content/uploads/fonts/ and uncomment the url() lines below.

     Until the real font is present it falls back to a geometric sans. */
  @font-face {
    font-family: "Gotham Rounded";
    font-weight: 400; font-style: normal; font-display: swap;
    src: local("Gotham Rounded Book"), local("GothamRounded-Book"), local("Gotham Rounded");
    /* , url("/wp-content/uploads/fonts/GothamRounded-Book.woff2") format("woff2") */
  }
  @font-face {
    font-family: "Gotham Rounded";
    font-weight: 500; font-style: normal; font-display: swap;
    src: local("Gotham Rounded Medium"), local("GothamRounded-Medium");
    /* , url("/wp-content/uploads/fonts/GothamRounded-Medium.woff2") format("woff2") */
  }
  @font-face {
    font-family: "Gotham Rounded";
    font-weight: 700; font-style: normal; font-display: swap;
    src: local("Gotham Rounded Bold"), local("GothamRounded-Bold");
    /* , url("/wp-content/uploads/fonts/GothamRounded-Bold.woff2") format("woff2") */
  }

  /* All rules are scoped under .mps-learn-hub so they never touch your theme. */
  .mps-learn-hub {
    --mps-orange: #EE7623;
    --mps-orange-hi: #f68a3d;
    --mps-yellow: #F4AF23;
    --mps-ink: #25282A;      /* brand dark grey — card background */
    --mps-ink-2: #2f3234;    /* slightly lifted panel */
    --mps-ground: #E4E5E3;   /* brand light grey — page ground */
    --mps-grey: #616365;     /* brand logo grey */
    --mps-white: #ffffff;
    --mps-muted: #b9bbbc;
    /* Gotham Rounded first (all common family-name variants), then a
       geometric fallback so it degrades gracefully. */
    --mps-font: "Gotham Rounded", "Gotham Rounded A", "Gotham Rounded B",
                "Gotham Round", "Gotham", "Montserrat", "Century Gothic",
                "Helvetica Neue", Arial, sans-serif;

    box-sizing: border-box;
    background: var(--mps-ground);
    padding: clamp(24px, 5vw, 72px) clamp(16px, 4vw, 40px);
    font-family: var(--mps-font);
    -webkit-font-smoothing: antialiased;
  }
  .mps-learn-hub *,
  .mps-learn-hub *::before,
  .mps-learn-hub *::after { box-sizing: border-box; }

  .mps-hub {
    max-width: 1180px;
    margin: 0 auto;
    background: var(--mps-ink);
    border-radius: 28px;                 /* brand rule: round all corners */
    padding: clamp(28px, 4vw, 56px);
  }

  .mps-hub__title {
    margin: 0;
    color: var(--mps-orange);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1;
    font-size: clamp(28px, 5vw, 44px);
    text-wrap: balance;
  }
  .mps-hub__eyebrow {
    margin: 14px 0 0;
    color: var(--mps-orange);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: clamp(12px, 1.4vw, 14px);
    max-width: 34ch;
    line-height: 1.5;
  }

  .mps-hub__grid {
    margin-top: clamp(28px, 3.5vw, 44px);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(24px, 3vw, 40px) clamp(24px, 3vw, 44px);
  }
  @media (max-width: 720px) {
    .mps-hub__grid { grid-template-columns: minmax(0, 1fr); }
  }

  .mps-card { margin: 0; display: flex; flex-direction: column; gap: 14px; }

  .mps-card__title {
    color: var(--mps-white);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(14px, 1.5vw, 16px);
    line-height: 1.3;
  }

  /* Thumbnail is a button so the whole tile is clickable and keyboard-focusable. */
  .mps-card__play {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    padding: 0;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    background-color: var(--mps-ink-2);
    background-image:
      linear-gradient(150deg, rgba(238,118,35,0.18), rgba(37,40,42,0.9) 60%),
      var(--thumb, none);
    background-size: cover;
    background-position: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  /* Once a real video thumbnail is loaded, drop the placeholder tint and marks. */
  .mps-card__play.has-thumb {
    background-image:
      linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.12)),
      var(--thumb, none);
  }
  .mps-card__play.has-thumb .mps-card__label,
  .mps-card__play.has-thumb .mps-card__badge { display: none; }

  .mps-card__play:hover,
  .mps-card__play:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.4);
    outline: none;
  }
  .mps-card__play:focus-visible { outline: 3px solid var(--mps-yellow); outline-offset: 3px; }

  /* Faint product wordmark shown on placeholder thumbnails (real image covers it). */
  .mps-card__label {
    position: absolute;
    left: 22px;
    bottom: 20px;
    right: 22px;
    color: var(--mps-white);
    text-align: left;
    text-transform: uppercase;
    font-weight: 800;
    font-size: clamp(15px, 2vw, 22px);
    letter-spacing: 0.02em;
    line-height: 1.1;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  .mps-card__label small {
    display: block;
    font-weight: 500;
    font-size: 0.62em;
    letter-spacing: 0.16em;
    opacity: 0.85;
    margin-bottom: 4px;
  }

  .mps-card__badge {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.35);
    color: var(--mps-orange);
    font-weight: 800;
    font-size: 16px;
    pointer-events: none;
  }

  .mps-card__ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(56px, 8vw, 74px);
    height: clamp(56px, 8vw, 74px);
    transform: translate(-50%, -50%);
    background: var(--mps-orange);
    border-radius: 50%;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    transition: background 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .mps-card__play:hover .mps-card__ring { background: var(--mps-orange-hi); transform: translate(-50%, -50%) scale(1.06); }
  .mps-card__ring svg { width: 40%; height: 40%; margin-left: 8%; fill: #fff; }

  /* ── Video modal ───────────────────────────────────────────────────── */
  .mps-modal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(15, 16, 17, 0.86);
  }
  .mps-modal[data-open="true"] { display: grid; }
  .mps-modal__frame {
    position: relative;
    width: min(960px, 100%);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .mps-modal__frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .mps-modal__note {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: var(--mps-muted);
    font-family: var(--mps-font);
    font-size: 15px;
    line-height: 1.5;
  }
  .mps-modal__close {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--mps-orange);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .mps-modal__close:focus-visible { outline: 3px solid var(--mps-yellow); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .mps-learn-hub * { transition: none !important; }
  }
</style>

<section class="mps-learn-hub" aria-labelledby="mps-hub-title">
  <div class="mps-hub">
    <h2 class="mps-hub__title" id="mps-hub-title">MPS Learn Hub</h2>
    <p class="mps-hub__eyebrow">Learn how to get the most from your MPS solutions</p>

    <div class="mps-hub__grid">

      <!-- ── HOW TO ADD A VIDEO ─────────────────────────────────────────
           Just paste the YouTube link (or the 11-char video ID) into
           data-yt="…". The script auto-fills BOTH the thumbnail and the
           player — no separate image upload needed.
           e.g. data-yt="https://youtu.be/dQw4w9WgXcQ"  or  data-yt="dQw4w9WgXcQ"
           (Prefer a custom thumbnail? Add style="--thumb:url('IMAGE-URL')".) -->

      <!-- ── CARD 1 ────────────────────────────────────────────────────── -->
      <figure class="mps-card">
        <figcaption class="mps-card__title">Fixing a Paper Jam — HP E786 Gemstone</figcaption>
        <button class="mps-card__play" type="button"
                data-yt=""
                data-title="Fixing a Paper Jam — HP E786 Gemstone"
                aria-label="Play: Fixing a Paper Jam, HP E786 Gemstone">
          <span class="mps-card__badge" aria-hidden="true">S</span>
          <span class="mps-card__label" aria-hidden="true"><small>MPS</small>Fixing a Paper Jam · HP E786 Gemstone</span>
          <span class="mps-card__ring" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </button>
      </figure>

      <!-- ── CARD 2 ────────────────────────────────────────────────────── -->
      <figure class="mps-card">
        <figcaption class="mps-card__title">Supply Levels — HP A3 Photocopier</figcaption>
        <button class="mps-card__play" type="button"
                data-yt=""
                data-title="Supply Levels — HP A3 Photocopier"
                aria-label="Play: Supply Levels, HP A3 Photocopier">
          <span class="mps-card__badge" aria-hidden="true">S</span>
          <span class="mps-card__label" aria-hidden="true"><small>MPS</small>Supply Levels · HP A3 Photocopier</span>
          <span class="mps-card__ring" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </button>
      </figure>

      <!-- Duplicate a <figure class="mps-card"> block to add more videos. -->

    </div>
  </div>

  <!-- Video modal (shared by all cards) -->
  <div class="mps-modal" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="mps-modal__frame">
      <button class="mps-modal__close" type="button" aria-label="Close video">&times;</button>
      <div class="mps-modal__body"></div>
    </div>
  </div>
</section>

<script>
(function () {
  var hub = document.currentScript.closest(".mps-learn-hub")
            || document.querySelector(".mps-learn-hub");
  if (!hub) return;

  var modal = hub.querySelector(".mps-modal");
  var body = hub.querySelector(".mps-modal__body");
  var closeBtn = hub.querySelector(".mps-modal__close");
  var lastFocused = null;

  // Pull the 11-char video ID out of a full YouTube URL or a bare ID.
  function youTubeId(value) {
    if (!value) return "";
    value = value.trim();
    var m = value.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if (m) return m[1];
    if (/^[\w-]{11}$/.test(value)) return value;   // already an ID
    return "";
  }

  // For each card with data-yt, auto-fill the thumbnail + embed URL.
  hub.querySelectorAll(".mps-card__play[data-yt]").forEach(function (btn) {
    var id = youTubeId(btn.getAttribute("data-yt"));
    if (!id) return;
    btn.setAttribute("data-embed", "https://www.youtube.com/embed/" + id);
    var figure = btn.closest(".mps-card");
    // Use the widescreen maxres thumb; fall back to hqdefault if it's missing.
    var probe = new Image();
    probe.onload = function () {
      var url = probe.naturalWidth > 120
        ? "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg"
        : "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
      figure.style.setProperty("--thumb", "url('" + url + "')");
      btn.classList.add("has-thumb");
    };
    probe.onerror = function () {
      figure.style.setProperty("--thumb", "url('https://i.ytimg.com/vi/" + id + "/hqdefault.jpg')");
      btn.classList.add("has-thumb");
    };
    probe.src = "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg";
  });

  function openModal(embed, title) {
    lastFocused = document.activeElement;
    if (embed) {
      body.innerHTML = '<iframe src="' + embed +
        '?autoplay=1&rel=0" title="' + (title || "Video") +
        '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    } else {
      body.innerHTML = '<div class="mps-modal__note">Add this video by setting ' +
        '<strong>data-embed</strong> on the card to your YouTube or Vimeo embed URL.</div>';
    }
    modal.setAttribute("data-open", "true");
    closeBtn.focus();
    document.addEventListener("keydown", onKey);
  }

  function closeModal() {
    modal.removeAttribute("data-open");
    body.innerHTML = "";               // stops playback
    document.removeEventListener("keydown", onKey);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  function onKey(e) { if (e.key === "Escape") closeModal(); }

  hub.querySelectorAll(".mps-card__play").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openModal(btn.getAttribute("data-embed"), btn.getAttribute("data-title"));
    });
  });

  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
})();
</script>
