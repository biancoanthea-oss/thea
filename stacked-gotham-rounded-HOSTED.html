<style>
/* ===== STACKED IT — GOTHAM ROUNDED WEBFONT (self-hosted) =====
   1) Upload these 3 files to your CMS file/media library:
        GothamRnd-book.woff2, GothamRnd-medium.woff2, GothamRnd-bold.woff2
   2) Replace the URLs below with the addresses your CMS gives them.
   3) Paste this whole block into the global Page header.            */

@font-face{font-family:'Gotham Rounded';font-style:normal;font-weight:400;font-display:swap;
  src:url('REPLACE-WITH-URL/GothamRnd-book.woff2') format('woff2');}
@font-face{font-family:'Gotham Rounded';font-style:normal;font-weight:500;font-display:swap;
  src:url('REPLACE-WITH-URL/GothamRnd-medium.woff2') format('woff2');}
@font-face{font-family:'Gotham Rounded';font-style:normal;font-weight:700;font-display:swap;
  src:url('REPLACE-WITH-URL/GothamRnd-bold.woff2') format('woff2');}

/* Apply Gotham Rounded site-wide */
body, input, select, textarea, button, .button,
h1,h2,h3,h4,h5,h6,.h1,.h2,.h3{
  font-family:'Gotham Rounded','Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif !important;
}
</style>
