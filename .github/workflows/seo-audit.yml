name: SEO audit

# The recurring SEO agent's safety net: re-checks the live site every week (and
# on every push) for the things that quietly break how it's found and shared —
# title/description, Open Graph & Twitter cards, the indexing policy, robots.txt
# and reachable routes. Opens an issue when something regresses.
#
# Setup (one time): add a repository variable named SITE_URL pointing at the
# deployed site — GitHub → Settings → Secrets and variables → Actions →
# Variables → New repository variable. Without it, the job is skipped.

on:
  schedule:
    # Mondays at 08:17 UTC (off the :00 mark on purpose).
    - cron: "17 8 * * 1"
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run SEO audit
        id: audit
        if: ${{ vars.SITE_URL != '' }}
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}
        run: |
          set -o pipefail
          node scripts/seo-audit.mjs "${{ vars.SITE_URL }}" | tee audit.txt

      - name: Note missing SITE_URL
        if: ${{ vars.SITE_URL == '' }}
        run: echo "::warning::SITE_URL repository variable is not set — skipping the live audit."

      - name: Open an issue on regression
        if: ${{ failure() && steps.audit.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('audit.txt', 'utf8'); } catch {}
            const body = [
              'The weekly SEO audit found a regression on the live site.',
              '',
              '```',
              report.trim() || '(no report captured)',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'SEO audit regression',
              body,
              labels: ['seo'],
            });
