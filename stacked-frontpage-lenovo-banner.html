<!-- ===== STACKED IT — LENOVO REFRESH HOMEPAGE PROMO (paste into a Front page section) ===== -->
<style>
  .sit-promo{--orange:#EE7623;--orange-dk:#d4621a;--yellow:#F4AF23;--ink:#25282A;
    position:relative;overflow:hidden;border-radius:16px;color:#fff;
    background:radial-gradient(900px 420px at 88% 12%, rgba(238,118,35,.28), transparent 60%),linear-gradient(150deg,#2c3033,#25282A 55%,#1b1e20);
    padding:38px 44px;margin:18px 0;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
  .sit-promo::before{content:"";position:absolute;top:-70px;left:-70px;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--yellow), var(--orange) 60%, var(--orange-dk));opacity:.85;filter:blur(2px)}
  .sit-promo .sit-copy{position:relative;z-index:1;max-width:640px}
  .sit-promo .sit-eyebrow{display:inline-block;background:rgba(244,175,35,.16);color:var(--yellow);
    border:1px solid rgba(244,175,35,.45);padding:5px 14px;border-radius:30px;font-size:12px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  .sit-promo h2{font-size:clamp(24px,3.4vw,38px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;color:#fff}
  .sit-promo h2 .hl{color:var(--yellow)}
  .sit-promo p{font-size:16px;color:#c7d0d6;margin:0 0 20px;max-width:540px}
  .sit-promo .sit-cta{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,var(--orange),var(--orange-dk));
    color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:10px;
    box-shadow:0 12px 26px rgba(238,118,35,.32);transition:transform .18s ease,box-shadow .18s ease}
  .sit-promo .sit-cta:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(238,118,35,.42)}
  .sit-promo .sit-cta svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}
  .sit-promo .sit-offer{position:relative;z-index:1;flex:none;text-align:center;
    border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:22px 30px;
    background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.18))}
  .sit-promo .sit-offer .up{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#e7edf1}
  .sit-promo .sit-offer .num{font-size:64px;font-weight:800;line-height:.9;
    background:linear-gradient(180deg,var(--yellow),var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sit-promo .sit-offer .num sup{font-size:24px;-webkit-text-fill-color:var(--orange)}
  .sit-promo .sit-offer .off{font-size:14px;font-weight:800;letter-spacing:.06em}
  @media(max-width:720px){.sit-promo{padding:30px 24px;justify-content:center;text-align:center}.sit-promo p{margin-inline:auto}}
</style>

<div class="sit-promo">
  <div class="sit-copy">
    <span class="sit-eyebrow">Lenovo Device Refresh</span>
    <h2>Refresh your business technology with <span class="hl">Lenovo</span></h2>
    <p>Replace ageing equipment, expand your workforce or standardise devices across your organisation — with trade-in, flexible financing and full support from Stacked IT.</p>
    <a class="sit-cta" href="https://shopit.stacked.ie/cms/lenovo-device-refresh">
      View the offers <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
  <div class="sit-offer">
    <div class="up">Up to</div>
    <div class="num">15<sup>%</sup></div>
    <div class="off">OFF</div>
  </div>
</div>
